<!DOCTYPE html>
<html>
    <head>
        <title>NewsChecker | Fake News Detector</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>NewsChecker</h1>
        <p>Paste the article text in the following input boxes:</p>
        <div class="input-area">
            <p class="input-label">Article Text:</p> 
            <textarea class="article-text-input"></textarea>
        </div>
        <button class="submit-button" onclick="checkArticle()">Submit</button>
        <div class="result-display">
            <p class="result-label"></p>
            <p class="result-score"></p>
        </div>

        <!-- Defer loading until HTML parsing is complete so DOM elements are available -->
        <script src="app.js" defer></script>
    </body>
</html>
